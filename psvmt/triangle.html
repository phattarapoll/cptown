<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบทดสอบเรขาคณิตพร้อมภาพประกอบ (20 ข้อ)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 650px;
        }
        h2 {
            text-align: center;
            color: #1a365d;
            margin-bottom: 10px;
        }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #edf2f7;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            color: #4a5568;
        }
        .quiz-card {
            background-color: #f7fafc;
            border: 1px solid #e2e8f0;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }
        .shape-container {
            margin: 15px 0;
            display: flex;
            justify-content: center;
        }
        .question-text {
            font-size: 18px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 15px;
        }
        .choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .choice-btn {
            background-color: #ffffff;
            border: 2px solid #cbd5e0;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            align-items: center;
        }
        .choice-btn:hover:not(:disabled) {
            border-color: #3182ce;
            background-color: #ebf8ff;
        }
        .choice-btn.correct {
            border-color: #38a169;
            background-color: #f0fff4;
            color: #22543d;
        }
        .choice-btn.incorrect {
            border-color: #e53e3e;
            background-color: #fff5f5;
            color: #742a2a;
        }
        .btn-main {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-main:hover {
            background-color: #2b6cb0;
        }
        .explanation {
            font-size: 15px;
            color: #2d3748;
            line-height: 1.6;
            background-color: #fff;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #3182ce;
            margin-top: 10px;
            text-align: left;
        }
        .stats-box {
            background-color: #edf2f7;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 14px;
            color: #2d3748;
            text-align: left;
        }
        #summary-screen {
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>แบบทดสอบเรขาคณิต (มีภาพประกอบ)</h2>
        
        <!-- หน้าทำข้อสอบ -->
        <div id="quiz-screen">
            <div class="quiz-header">
                <span id="progress-text">ข้อที่ 1 / 20</span>
                <span id="timer-text">⏱️ เวลา: 00:00</span>
            </div>

            <div class="quiz-card">
                <div class="question-text" id="question-text"></div>
                <div class="shape-container" id="shape-display"></div>
                
                <div class="choices" id="choices-container"></div>

                <div id="result-container" style="display: none;">
                    <div id="result-message" style="font-weight: bold; font-size: 18px; margin-bottom: 8px;"></div>
                    <div class="explanation" id="explanation-box"></div>
                    <div style="text-align: right; margin-top: 15px;">
                        <button class="btn-main" onclick="nextQuestion()">ข้อถัดไป ➔</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- หน้าสรุปผลลัพธ์ -->
        <div id="summary-screen">
            <h3 style="color: #2b6cb0; margin-bottom: 10px;">🎉 สรุปผลการทดสอบ</h3>
            <div id="summary-content" style="font-size: 18px; line-height: 1.8; margin-bottom: 20px;"></div>
            <div class="stats-box" id="daily-stats"></div>
            <br>
            <button class="btn-main" onclick="startExam()">ทำข้อสอบชุดใหม่อีกครั้ง</button>
        </div>
    </div>

    <script>
        const TOTAL_QUESTIONS = 20;
        let currentIdx = 0;
        let score = 0;
        let wrongCount = 0;
        let startTime = 0;
        let timerInterval;

        let currentCorrectChoice = '';
        let currentExplanationText = '';
        let quizDataList = [];

        function generateQuizSet() {
            quizDataList = [];
            const types = ['triangle_angle', 'triangle_side', 'square_shape', 'circle_shape'];

            for (let q = 0; q < TOTAL_QUESTIONS; q++) {
                let type = types[Math.floor(Math.random() * types.length)];
                let questionText = "";
                let svgHtml = "";
                let correctAns = 0;
                let explanation = "";
                let unit = "หน่วย";

                if (type === 'triangle_angle') {
                    let a = Math.floor(Math.random() * 40) + 40;
                    let b = Math.floor(Math.random() * 40) + 40;
                    if (a + b >= 160) b = 150 - a;
                    correctAns = 180 - (a + b);
                    unit = "องศา";

                    questionText = `จงหาขนาดของมุม x ในรูปสามเหลี่ยมนี้`;
                    svgHtml = `
                        <svg width="180" height="130" viewBox="0 0 180 130">
                            <polygon points="20,115 160,115 90,20" stroke="#2b6cb0" stroke-width="3" fill="#ebf8ff"/>
                            <text x="35" y="105" font-size="14" font-weight="bold" fill="#2d3748">${a}&deg;</text>
                            <text x="125" y="105" font-size="14" font-weight="bold" fill="#2d3748">${b}&deg;</text>
                            <text x="83" y="55" font-size="14" font-weight="bold" fill="#e53e3e">x&deg;</text>
                        </svg>
                    `;
                    explanation = `<b>วิธีคิด:</b> ผลรวมมุมภายในของรูปสามเหลี่ยมเท่ากับ 180&deg;<br>&bull; x = 180&deg; - (${a}&deg; + ${b}&deg;)<br>&bull; x = 180&deg; - ${a + b}&deg; = <b>${correctAns} องศา</b>`;
                } 
                else if (type === 'triangle_side') {
                    let baseTriples = [[3, 4, 5], [6, 8, 10], [5, 12, 13]];
                    let triple = baseTriples[Math.floor(Math.random() * baseTriples.length)];
                    let m = Math.floor(Math.random() * 2) + 1;
                    let a = triple[0] * m, b = triple[1] * m, c = triple[2] * m;
                    
                    correctAns = c;
                    questionText = `จากรูปสามเหลี่ยมมุมฉาก จงหาความยาวด้านตรงข้ามมุมฉาก (c)`;
                    svgHtml = `
                        <svg width="160" height="130" viewBox="0 0 160 130">
                            <polygon points="20,115 140,115 20,20" stroke="#2b6cb0" stroke-width="3" fill="#ebf8ff"/>
                            <rect x="20" y="95" width="20" height="20" stroke="#2b6cb0" stroke-width="2" fill="none"/>
                            <text x="70" y="130" font-size="14" font-weight="bold" fill="#2d3748">${a}</text>
                            <text x="0" y="70" font-size="14" font-weight="bold" fill="#2d3748">${b}</text>
                            <text x="85" y="65" font-size="14" font-weight="bold" fill="#e53e3e">c = ?</text>
                        </svg>
                    `;
                    explanation = `<b>วิธีคิด (ทฤษฎีบทพิทาโกรัส):</b><br>&bull; สูตร: c<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup><br>&bull; แทนค่า: c<sup>2</sup> = ${a}<sup>2</sup> + ${b}<sup>2</sup> = ${a*a} + ${b*b} = ${c*c}<br>&bull; ถอดสแควร์รูท: c = &radic;${c*c} = <b>${correctAns} หน่วย</b>`;
                } 
                else if (type === 'square_shape') {
                    let side = Math.floor(Math.random() * 10) + 4;
                    let askArea = Math.random() > 0.5;
                    
                    if (askArea) {
                        correctAns = side * side;
                        unit = "ตารางหน่วย";
                        questionText = `จงหาพื้นที่ของรูปสี่เหลี่ยมจัตุรัสนี้`;
                        explanation = `<b>วิธีคิด:</b> พื้นที่สี่เหลี่ยมจัตุรัส = ด้าน &times; ด้าน<br>&bull; ${side} &times; ${side} = <b>${correctAns} ตารางหน่วย</b>`;
                    } else {
                        correctAns = side * 4;
                        questionText = `จงหาความยาวรอบรูปของสี่เหลี่ยมจัตุรัสนี้`;
                        explanation = `<b>วิธีคิด:</b> ความยาวรอบรูป = 4 &times; ด้าน<br>&bull; 4 &times; ${side} = <b>${correctAns} หน่วย</b>`;
                    }

                    svgHtml = `
                        <svg width="130" height="130" viewBox="0 0 130 130">
                            <rect x="20" y="20" width="90" height="90" stroke="#2b6cb0" stroke-width="3" fill="#ebf8ff"/>
                            <text x="65" y="15" font-size="14" font-weight="bold" text-anchor="middle" fill="#2d3748">ด้าน = ${side}</text>
                        </svg>
                    `;
                } 
                else {
                    let r = (Math.floor(Math.random() * 5) + 1) * 7;
                    correctAns = 2 * (22 / 7) * r;
                    questionText = `จงหาความยาวรอบรูปวงกลม (กำหนดค่า &pi; &approx; 22/7)`;
                    svgHtml = `
                        <svg width="140" height="140" viewBox="0 0 140 140">
                            <circle cx="70" cy="70" r="50" stroke="#2b6cb0" stroke-width="3" fill="#ebf8ff"/>
                            <line x1="70" y1="70" x2="120" y2="70" stroke="#e53e3e" stroke-width="2" stroke-dasharray="4"/>
                            <circle cx="70" cy="70" r="3" fill="#2b6cb0"/>
                            <text x="90" y="62" font-size="14" font-weight="bold" fill="#e53e3e">r = ${r}</text>
                        </svg>
                    `;
                    explanation = `<b>วิธีคิด:</b> เส้นรอบวง = 2 &times; &pi; &times; r<br>&bull; 2 &times; (22/7) &times; ${r} = <b>${correctAns} หน่วย</b>`;
                }

                let choicesSet = new Set();
                choicesSet.add(correctAns);
                let offsets = [-5, -3, 3, 5, 10];
                offsets.sort(() => Math.random() - 0.5);

                for (let i = 0; i < offsets.length && choicesSet.size < 4; i++) {
                    let fake = correctAns + offsets[i];
                    if (fake > 0 && fake !== correctAns) choicesSet.add(fake);
                }
                while(choicesSet.size < 4) {
                    choicesSet.add(correctAns + Math.floor(Math.random() * 10) + 1);
                }

                let choicesArray = Array.from(choicesSet);
                choicesArray.sort(() => Math.random() - 0.5);

                quizDataList.push({
                    questionText,
                    svgHtml,
                    correctAns,
                    unit,
                    explanation,
                    choices: choicesArray
                });
            }
        }

        function startExam() {
            currentIdx = 0;
            score = 0;
            wrongCount = 0;
            startTime = Date.now();

            generateQuizSet();

            document.getElementById('quiz-screen').style.display = 'block';
            document.getElementById('summary-screen').style.display = 'none';

            clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);

            loadQuestion();
        }

        function updateTimer() {
            let elapsedSec = Math.floor((Date.now() - startTime) / 1000);
            let min = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
            let sec = String(elapsedSec % 60).padStart(2, '0');
            document.getElementById('timer-text').innerText = `⏱️ เวลา: ${min}:${sec}`;
        }

        function loadQuestion() {
            document.getElementById('result-container').style.display = 'none';
            document.getElementById('progress-text').innerText = `ข้อที่ ${currentIdx + 1} / ${TOTAL_QUESTIONS}`;

            let q = quizDataList[currentIdx];
            document.getElementById('question-text').innerHTML = q.questionText;
            document.getElementById('shape-display').innerHTML = q.svgHtml;

            const letters = ['ก', 'ข', 'ค', 'ง'];
            let choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';

            q.choices.forEach((choice, index) => {
                let letter = letters[index];
                if (choice === q.correctAns) {
                    currentCorrectChoice = letter;
                }

                let btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerHTML = `<span style="margin-right: 10px; color: #4a5568;">${letter}.</span> ${choice} ${q.unit}`;
                btn.onclick = function() {
                    checkAnswer(letter, btn);
                };
                choicesContainer.appendChild(btn);
            });

            currentExplanationText = q.explanation;
        }

        function checkAnswer(selectedLetter, clickedBtn) {
            let allBtns = document.querySelectorAll('.choice-btn');
            allBtns.forEach(b => {
                b.disabled = true;
                if (b.innerHTML.includes(currentCorrectChoice + '.')) {
                    b.classList.add('correct');
                }
            });

            let resContainer = document.getElementById('result-container');
            resContainer.style.display = 'block';
            let msg = document.getElementById('result-message');
            document.getElementById('explanation-box').innerHTML = currentExplanationText;

            if (selectedLetter === currentCorrectChoice) {
                score++;
                msg.style.color = '#38a169';
                msg.innerText = '🎉 ถูกต้อง!';
            } else {
                wrongCount++;
                clickedBtn.classList.add('incorrect');
                msg.style.color = '#e53e3e';
                msg.innerText = `❌ ผิดครับ คำตอบที่ถูกต้องคือข้อ ${currentCorrectChoice}`;
            }
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < TOTAL_QUESTIONS) {
                loadQuestion();
            } else {
                endExam();
            }
        }

        function endExam() {
            clearInterval(timerInterval);
            let totalSec = Math.floor((Date.now() - startTime) / 1000);
            let avgSecPerQuestion = (totalSec / TOTAL_QUESTIONS).toFixed(1);
            let avgMinute = (avgSecPerQuestion / 60).toFixed(2);

            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('summary-screen').style.display = 'block';

            let summaryHtml = `
                ✅ ทำถูก: <b>${score}</b> ข้อ<br>
                ❌ ทำผิด: <b>${wrongCount}</b> ข้อ<br>
                ⏱️ ใช้เวลาทั้งหมด: <b>${Math.floor(totalSec/60)} นาที ${totalSec%60} วินาที</b><br>
                ⚡ เฉลี่ยข้อละ: <b>${avgSecPerQuestion} วินาที</b> (${avgMinute} นาที/ข้อ)
            `;
            document.getElementById('summary-content').innerHTML = summaryHtml;

            saveDailyStats(score, wrongCount, totalSec);
        }

        function saveDailyStats(newScore, newWrong, newSec) {
            let todayKey = new Date().toISOString().slice(0, 10);
            let savedData = JSON.parse(localStorage.getItem('geometry_visual_stats_' + todayKey)) || {
                totalSets: 0, totalScore: 0, totalWrong: 0, totalTimeSec: 0
            };

            savedData.totalSets += 1;
            savedData.totalScore += newScore;
            savedData.totalWrong += newWrong;
            savedData.totalTimeSec += newSec;

            localStorage.setItem('geometry_visual_stats_' + todayKey, JSON.stringify(savedData));

            let avgTimeToday = (savedData.totalTimeSec / (savedData.totalSets * TOTAL_QUESTIONS)).toFixed(1);
            let statsHtml = `
                <b>📊 สถิติมิติสัมพันธ์/เรขาคณิตของคุณวันนี้ (${todayKey}):</b><br>
                - ทำไปแล้วทั้งหมด: <b>${savedData.totalSets} ชุด</b> (${savedData.totalSets * TOTAL_QUESTIONS} ข้อ)<br>
                - ถูกสะสม: <b>${savedData.totalScore}</b> ข้อ | ผิดสะสม: <b>${savedData.totalWrong}</b> ข้อ<br>
                - เวลาเฉลี่ย: <b>${avgTimeToday} วินาที ต่อข้อ</b>
            `;
            document.getElementById('daily-stats').innerHTML = statsHtml;
        }

        window.onload = startExam;
    </script>
</body>
</html>
