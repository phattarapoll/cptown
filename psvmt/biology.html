<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คลังข้อสอบชีววิทยา ม.ต้น (ม.1-3 ครบทุกบท พร้อมคำอธิบายเชิงลึก)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 700px;
        }
        h2 {
            text-align: center;
            color: #276749;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #4a5568;
            margin-bottom: 20px;
        }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f0fff4;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            color: #22543d;
            border: 1px solid #c6f6d5;
        }
        .quiz-card {
            background-color: #f7fafc;
            border: 1px solid #e2e8f0;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }
        .shape-container {
            margin: 15px 0;
            display: flex;
            justify-content: center;
        }
        .question-text {
            font-size: 18px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 15px;
            text-align: left;
        }
        .choices {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .choice-btn {
            background-color: #ffffff;
            border: 2px solid #cbd5e0;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            align-items: center;
        }
        .choice-btn:hover:not(:disabled) {
            border-color: #38a169;
            background-color: #f0fff4;
        }
        .choice-btn.correct {
            border-color: #38a169;
            background-color: #f0fff4;
            color: #22543d;
        }
        .choice-btn.incorrect {
            border-color: #e53e3e;
            background-color: #fff5f5;
            color: #742a2a;
        }
        .btn-main {
            background-color: #38a169;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-main:hover {
            background-color: #2f855a;
        }
        .explanation {
            font-size: 15px;
            color: #2d3748;
            line-height: 1.6;
            background-color: #fff;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #38a169;
            margin-top: 10px;
            text-align: left;
        }
        .stats-box {
            background-color: #f0fff4;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 14px;
            color: #22543d;
            text-align: left;
            border: 1px solid #c6f6d5;
        }
        #summary-screen {
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🧬 ตะลุยโจทย์ชีวะ ม.ต้น (ม.1-3)</h2>
        <div class="subtitle">ฝึกคิด วิเคราะห์ พร้อมคำอธิบายเชิงลึกทุกข้อ</div>
        
        <!-- หน้าทำข้อสอบ -->
        <div id="quiz-screen">
            <div class="quiz-header">
                <span id="progress-text">ข้อที่ 1 / 20</span>
                <span id="timer-text">⏱️ เวลา: 00:00</span>
            </div>

            <div class="quiz-card">
                <div class="question-text" id="question-text"></div>
                <div class="shape-container" id="shape-display"></div>
                
                <div class="choices" id="choices-container"></div>

                <div id="result-container" style="display: none;">
                    <div id="result-message" style="font-weight: bold; font-size: 18px; margin-bottom: 8px;"></div>
                    <div class="explanation" id="explanation-box"></div>
                    <div style="text-align: right; margin-top: 15px;">
                        <button class="btn-main" onclick="nextQuestion()">ข้อถัดไป ➔</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- หน้าสรุปผลลัพธ์ -->
        <div id="summary-screen">
            <h3 style="color: #276749; margin-bottom: 10px;">🎉 สรุปผลการทดสอบชีววิทยา ม.ต้น</h3>
            <div id="summary-content" style="font-size: 18px; line-height: 1.8; margin-bottom: 20px;"></div>
            <div class="stats-box" id="daily-stats"></div>
            <br>
            <button class="btn-main" onclick="startExam()">ทำข้อสอบชุดใหม่อีกครั้ง</button>
        </div>
    </div>

    <script>
        const TOTAL_QUESTIONS = 20;
        let currentIdx = 0;
        let score = 0;
        let wrongCount = 0;
        let startTime = 0;
        let timerInterval;

        let currentCorrectChoice = '';
        let currentExplanationText = '';
        let quizDataList = [];

        function generateQuizSet() {
            quizDataList = [];
            const bank = [
                // บทที่ 1: เซลล์และออร์แกเนลล์
                {
                    tag: "เซลล์และออร์แกเนลล์ (ม.1)",
                    q: "ข้อใดเปรียบเทียบหน้าที่ของออร์แกเนลล์ในเซลล์สัตว์ได้ถูกต้องที่สุด?",
                    svg: `<svg width="340" height="60" viewBox="0 0 340 60"><rect x="10" y="10" width="320" height="40" rx="6" fill="#f0fff4" stroke="#38a169" stroke-width="2"/><text x="170" y="35" font-size="13" font-weight="bold" text-anchor="middle" fill="#22543d">💡 คำใบ้: โรงงานสร้างพลังงาน (ATP)</text></svg>`,
                    choices: [
                        "ไมโตคอนเดรีย : สร้างพลังงาน (ATP)",
                        "ไรโบโซม : สังเคราะห์ด้วยแสง",
                        "คลอโรพลาสต์ : ควบคุมกิจกรรมภายในเซลล์สัตว์",
                        "แวคิวโอลขนาดใหญ่มาก : ขับของเสียออกจากเซลล์สัตว์ทันที"
                    ],
                    ans: "ไมโตคอนเดรีย : สร้างพลังงาน (ATP)",
                    exp: "<b>📚 คำอธิบายเชิงลึก:</b><br>• <b>ไมโตคอนเดรีย:</b> ทำหน้าที่หายใจระดับเซลล์เพื่อสร้างพลังงานรูป ATP จึงเปรียบเสมือนโรงงานไฟฟ้าของเซลล์<br>• <i>ทำไมข้ออื่นถึงผิด:</i> คลอโรพลาสต์ไม่พบในเซลล์สัตว์, ไรโบโซมสร้างโปรตีนไม่ใช่สังเคราะห์ด้วยแสง, และเซลล์สัตว์ไม่มีแวคิวโอลขนาดใหญ่เหมือนในพืช"
                },
                {
                    tag: "โครงสร้างเซลล์พืชและสัตว์ (ม.1)",
                    q: "โครงสร้างใดที่มีเฉพาะในเซลล์พืช แต่ <b>ไม่พบ</b> ในเซลล์สัตว์?",
                    svg: `<svg width="340" height="60" viewBox="0 0 340 60"><rect x="10" y="10" width="320" height="40" rx="6" fill="#ebf8ff" stroke="#3182ce" stroke-width="2"/><text x="170" y="35" font-size="13" font-weight="bold" text-anchor="middle" fill="#2d3748">💡 คำใบ้: โครงสร้างเพิ่มความแข็งแรง & สร้างอาหาร</text></svg>`,
                    choices: [
                        "ผนังเซลล์ (Cell wall) และคลอโรพลาสต์",
                        "เยื่อหุ้มเซลล์และไซโทพลาสซึม",
                        "นิวเคลียสและไมโตคอนเดรีย",
                        "ไรโบโซมและกอลจิบอดี้"
                    ],
                    ans: "ผนังเซลล์ (Cell wall) และคลอโรพลาสต์",
                    exp: "<b>📚 คำอธิบายเชิงลึก:</b><br>• <b>ผนังเซลล์:</b> ช่วยเพิ่มความแข็งแรงและคงรูปให้กับเซลล์พืช<br>• <b>คลอโรพลาสต์:</b> มีสารสีเขียว (คลอโรฟิลล์) ใช้ในกระบวนการสังเคราะห์ด้วยแสง ซึ่งทั้งสองอย่างนี้เซลล์สัตว์ไม่มี"
                },
                // บทที่ 2: การลำเลียงสารเข้า-ออกเซลล์
                {
                    tag: "การลำเลียงสาร (ม.1)",
                    q: "ถ้านำเซลล์เม็ดเลือดแดงไปแช่ในน้ำกลั่น จะเกิดเหตุการณ์ใดขึ้นเพราะเหตุใด?",
                    svg: `<svg width="340" height="60" viewBox="0 0 340 60"><rect x="10" y="10" width="320" height="40" rx="6" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/><text x="170" y="35" font-size="13" font-weight="bold" text-anchor="middle" fill="#742a2a">💡 คำใบ้: น้ำออสโมซิสเข้าสู่เซลล์ที่ไม่มีผนังห่อหุ้ม</text></svg>`,
                    choices: [
                        "เซลล์จะเต่งขึ้นและแตกออก เพราะน้ำออสโมซิสเข้าสู่เซลล์",
                        "เซลล์จะเหี่ยวลง เพราะน้ำออสโมซิสออกจากเซลล์",
                        "เซลล์มีขนาดเท่าเดิมเพราะสารมีความเข้มข้นเท่ากัน",
                        "เซลล์จะสลายตัวทันทีเนื่องจากปฏิกิริยาเคมี"
                    ],
                    ans: "เซลล์จะเต่งขึ้นและแตกออก เพราะน้ำออสโมซิสเข้าสู่เซลล์",
                    exp: "<b>📚 คำอธิบายเชิงลึก:</b><br>• น้ำกลั่นมีความเข้มข้นต่ำกว่าภายในเซลล์เม็ดเลือดแดง (สารละลายไฮโพทอนิก) น้ำจึงออสโมซิสเข้าสู่เซลล์อย่างต่อเนื่อง<br>• เนื่องจากเม็ดเลือดแดงไม่มีผนังเซลล์แข็งๆ รองรับ แรงดันจึงทำให้เซลล์แตก (Hemolysis) ได้"
                },
                // บทที่ 3: การสังเคราะห์ด้วยแสงของพืช
                {
                    tag: "การสังเคราะห์ด้วยแสง (ม.2)",
                    q: "สารตั้งต้นที่พืชนำมาใช้ในกระบวนการสังเคราะห์ด้วยแสงประกอบด้วยอะไรบ้าง?",
                    svg: `<svg width="340" height="60" viewBox="0 0 340 60"><rect x="10" y="10" width="320" height="40" rx="6" fill="#f0fff4" stroke="#38a169" stroke-width="2"/><text x="170" y="35" font-size="13" font-weight="bold" text-anchor="middle" fill="#22543d">💡 คำใบ้: วัตถุดิบที่พืชดูดซับจากอากาศและดิน</text></svg>`,
                    choices: [
                        "แก๊สคาร์บอนไดออกไซด์ และ น้ำ",
                        "แก๊สออกซิเจน และ กลูโคส",
                        "แก๊สออกซิเจน และ แสงแดด",
                        "แป้ง และ น้ำ"
                    ],
                    ans: "แก๊สคาร์บอนไดออกไซด์ และ น้ำ",
                    exp: "<b>📚 คำอธิบายเชิงลึก:</b><br>• สมการ: CO₂ + H₂O → Glucose + O₂ (โดยมีแสงและคลอโรฟิลล์)<br>• สารตั้งต้น (วัตถุดิบ) คือแก๊สคาร์บอนไดออกไซด์ที่รับมาจากอากาศและน้ำจากราก ส่วนกลูโคสและออกซิเจนคือ 'ผลผลิต'"
                },
                // บทที่ 4: ระบบย่อยอาหาร
                {
                    tag: "ระบบย่อยอาหาร (ม.2)",
                    q: "อวัยวะใดทำหน้าที่สร้างน้ำดี (Bile) เพื่อช่วยย่อยไขมันให้แตกตัวเป็นหยดเล็กๆ?",
                    svg: `<svg width="340" height="60" viewBox="0 0 340 60"><rect x="10" y="10" width="320" height="40" rx="6" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/><text x="170" y="35" font-size="13" font-weight="bold" text-anchor="middle" fill="#742a2a">💡 คำใบ้: ต่อมย่อยขนาดใหญ่ใต้ชายโครงขวา</text></svg>`,
                    choices: [
                        "ตับ (Liver) และเก็บไว้ที่ถุงน้ำดี",
                        "ตับอ่อน (Pancreas)",
                        "กระเพาะอาหาร",
                        "ลำไส้เล็กส่วนต้น"
                    ],
                    ans: "ตับ (Liver) และเก็บไว้ที่ถุงน้ำดี",
                    exp: "<b>📚 คำอธิบายเชิงลึก:</b><br>• <b>ตับ:</b> เป็นอวัยวะที่สร้างน้ำดี (ไม่ใช่เอนไซม์) แล้วส่งมาเก็บไว้ที่ถุงน้ำดี เพื่อปล่อยไปช่วยย่อยทางกายภาพโดยทำให้ไขมันแตกตัวเป็นหยดเล็กๆ ในลำไส้เล็ก"
                },
                // บทที่ 5: ระบบหมุนเวียนเลือด
                {
                    tag: "ระบบหมุนเวียนเลือด (ม.2)",
                    q: "หัวใจห้องใดของมนุษย์ที่มีผนังหนาที่สุด เพราะต้องบีบตัวส่งเลือดไปเลี้ยงทั่วร่างกาย?",
                    svg: `<svg width="340" height="60" viewBox="0 0 340 60"><rect x="10" y="10" width="320" height="40" rx="6" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/><text x="170" y="35" font-size="13" font-weight="bold" text-anchor="middle" fill="#742a2a">💡 คำใบ้: หัวใจห้องล่างฝั่งที่ส่งเลือดไปทั่วกาย</text></svg>`,
                    choices: [
                        "หัวใจห้องล่างซ้าย (Left Ventricle)",
                        "หัวใจห้องบนซ้าย (Left Atrium)",
                        "หัวใจห้องล่างขวา (Right Ventricle)",
                        "หัวใจห้องบนขวา (Right Atrium)"
                    ],
                    ans: "หัวใจห้องล่างซ้าย (Left Ventricle)",
                    exp: "<b>📚 คำอธิบายเชิงลึก:</b><br>• <b>หัวใจห้องล่างซ้าย:</b> ต้องใช้แรงบีบตัวสูงมากเพื่อส่งเลือดแดงผ่านหลอดเลือดแดงใหญ่เอออร์ตาไปเลี้ยงทั่วร่างกาย ผนังกล้ามเนื้อจึงหนาที่สุดในบรรดาหัวใจทั้ง 4 ห้อง"
                },
                // บทที่ 6: ระบบหายใจ
                {
                    tag: "ระบบหายใจ (ม.2)",
                    q: "การแลกเปลี่ยนแก๊สออกซิเจนกับคาร์บอนไดออกไซด์บริเวณปอด เกิดขึ้นที่โครงสร้างใด?",
                    svg: `<svg width="340" height="60" viewBox="0 0 340 60"><rect x="10" y="10" width="320" height="40" rx="6" fill="#ebf8ff" stroke="#3182ce" stroke-width="2"/><text x="170" y="35" font-size="13" font-weight="bold" text-anchor="middle" fill="#2d3748">💡 คำใบ้: ถุงลมขนาดเล็กปลายหลอดลมฝอย</text></svg>`,
                    choices: [
                        "ถุงลมปอด (Alveoli)",
                        "ขั้วปอด (Bronchus)",
                        "หลอดลม (Trachea)",
                        "กล่องเสียง (Larynx)"
                    ],
                    ans: "ถุงลมปอด (Alveoli)",
                    exp: "<b>📚 คำอธิบายเชิงลึก:</b><br>• <b>ถุงลมปอด (Alveoli):</b> มีลักษณะเป็นถุงบางๆ ห้อมล้อมด้วยหลอดเลือดฝอยจำนวนมาก เป็นตำแหน่งที่เกิดการแพร่ของแก๊สออกซิเจนเข้าสู่เลือดและขับคาร์บอนไดออกไซด์ออก"
                },
                // บทที่ 7: ระบบขับถ่าย
                {
                    tag: "ระบบขับถ่าย (ม.2)",
                    q: "หน่วยการทำงานที่เล็กที่สุดของไต ทำหน้าที่กรองของเสียออกจากเลือดคืออะไร?",
                    svg: `<svg width="340" height="60" viewBox="0 0 340 60"><rect x="10" y="10" width="320" height="40" rx="6" fill="#f0fff4" stroke="#38a169" stroke-width="2"/><text x="170" y="35" font-size="13" font-weight="bold" text-anchor="middle" fill="#22543d">💡 คำใบ้: หน่วยกรองในไต (Nephron)</text></svg>`,
                    choices: [
                        "เนฟรอน หรือ หน่วยไต (Nephron)",
                        "ยูรีเทอร์ (Ureter)",
                        "กระเพาะปัสสาวะ",
                        "โกลเมอรูลัส"
                    ],
                    ans: "เนฟรอน หรือ หน่วยไต (Nephron)",
                    exp: "<b>📚 คำอธิบายเชิงลึก:</b><br>• <b>เนฟรอน (Nephron):</b> เป็นหน่วยพื้นฐานในการกรองของเสีย (เช่น ยูเรีย) แร่ธาตุ และน้ำส่วนเกินออกจากเลือด เพื่อขับออกเป็นปัสสาวะ"
                },
                // บทที่ 8: ระบบประสาทและต่อมไร้ท่อ
                {
                    tag: "ระบบประสาทและต่อมไร้ท่อ (ม.3)",
                    q: "ส่วนใดของสมองที่ทำหน้าที่ควบคุมการทรงตัว และการประสานงานของการเคลื่อนไหว?",
                    svg: `<svg width="340" height="60" viewBox="0 0 340 60"><rect x="10" y="10" width="320" height="40" rx="6" fill="#faf5ff" stroke="#6b46c1" stroke-width="2"/><text x="170" y="35" font-size="13" font-weight="bold" text-anchor="middle" fill="#553c9a">💡 คำใบ้: สมองส่วนท้าย ควบคุมการทรงตัว</text></svg>`,
                    choices: [

                    tempBank = [...bank];
                    tempBank.sort(() => Math.random() - 0.5);
                }
                selectedQuestions.push(JSON.parse(JSON.stringify(tempBank.pop())));

                let choicesArray = [...item.choices];
                choicesArray.sort(() => Math.random() - 0.5);

                quizDataList.push({
                    questionText: `<b>[${item.tag}]</b><br>` + item.q,
                    svgHtml: item.svg,
                    correctAns: correctAns,

        function startExam() {
            currentIdx = 0;
            score = 0;
            wrongCount = 0;
            startTime = Date.now();
            quizDataList = [];

            generateQuizSet();

            document.getElementById('quiz-screen').style.display = 'block';
            document.getElementById('summary-screen').style.display = 'none';

            clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);

            loadQuestion();
        }

        function updateTimer() {
            let elapsedSec = Math.floor((Date.now() - startTime) / 1000);
            let min = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
            let sec = String(elapsedSec % 60).padStart(2, '0');
            document.getElementById('timer-text').innerText = `⏱️ เวลา: ${min}:${sec}`;
        }

        function loadQuestion() {
            document.getElementById('result-container').style.display = 'none';
            document.getElementById('progress-text').innerText = `ข้อที่ ${currentIdx + 1} / ${TOTAL_QUESTIONS}`;

            let q = quizDataList[currentIdx];
            document.getElementById('question-text').innerHTML = q.questionText;
            document.getElementById('shape-display').innerHTML = q.svgHtml;

            const letters = ['ก', 'ข', 'ค', 'ง'];
            let choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';

            q.choices.forEach((choice, index) => {
                let letter = letters[index];

                let btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerHTML = `<span style="margin-right: 10px; color: #4a5568; min-width: 20px;">${letter}.</span> <span>${choice}</span>`;
                btn.onclick = function() {
                    checkAnswer(choice, btn);
                };
                choicesContainer.appendChild(btn);
            });

            currentExplanationText = q.explanation;
        }

        function checkAnswer(selectedChoice, clickedBtn) {
            let q = quizDataList[currentIdx];
            let allBtns = document.querySelectorAll('.choice-btn');
            
            let correctLetter = '';
            const letters = ['ก', 'ข', 'ค', 'ง'];

            allBtns.forEach((b, idx) => {
                b.disabled = true;
                if (b.innerHTML.includes(q.correctAns)) {
                    b.classList.add('correct');
                    correctLetter = letters[idx];
                }
            });

            let resContainer = document.getElementById('result-container');
            resContainer.style.display = 'block';
            let msg = document.getElementById('result-message');
            document.getElementById('explanation-box').innerHTML = currentExplanationText;

            if (selectedChoice === q.correctAns) {
                score++;
                msg.style.color = '#38a169';
                msg.innerText = '🎉 ถูกต้อง!';
            } else {
                wrongCount++;
                clickedBtn.classList.add('incorrect');
                msg.style.color = '#e53e3e';
                msg.innerText = `❌ ผิดครับ คำตอบที่ถูกต้องคือข้อ ${correctLetter}: ${q.correctAns}`;
            }
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < TOTAL_QUESTIONS) {
                loadQuestion();
            } else {
                endExam();
            }
        }

        function endExam() {
            clearInterval(timerInterval);
            let totalSec = Math.floor((Date.now() - startTime) / 1000);
            let avgSecPerQuestion = (totalSec / TOTAL_QUESTIONS).toFixed(1);
            let avgMinute = (avgSecPerQuestion / 60).toFixed(2);

            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('summary-screen').style.display = 'block';

            let summaryHtml = `
                ✅ ทำถูก: <b>${score}</b> ข้อ<br>
                ❌ ทำผิด: <b>${wrongCount}</b> ข้อ<br>
                ⏱️ ใช้เวลาทั้งหมด: <b>${Math.floor(totalSec/60)} นาที ${totalSec%60} วินาที</b><br>
                ⚡ เฉลี่ยข้อละ: <b>${avgSecPerQuestion} วินาที</b> (${avgMinute} นาที/ข้อ)
            `;
            document.getElementById('summary-content').innerHTML = summaryHtml;

            saveDailyStats(score, wrongCount, totalSec);
        }

        function saveDailyStats(newScore, newWrong, newSec) {
            let todayKey = new Date().toISOString().slice(0, 10);
            let savedData = JSON.parse(localStorage.getItem('bio_m_ton_stats_' + todayKey)) || {
                totalSets: 0, totalScore: 0, totalWrong: 0, totalTimeSec: 0
            };

            savedData.totalSets += 1;
            savedData.totalScore += newScore;
            savedData.totalWrong += newWrong;
            savedData.totalTimeSec += newSec;

            localStorage.setItem('bio_m_ton_stats_' + todayKey, JSON.stringify(savedData));

            let avgTimeToday = (savedData.totalTimeSec / (savedData.totalSets * TOTAL_QUESTIONS)).toFixed(1);
            let statsHtml = `
                <b>📊 สถิติการทำข้อสอบชีวะ ม.ต้น วันนี้ (${todayKey}):</b><br>
                - ทำไปแล้วทั้งหมด: <b>${savedData.totalSets} ชุด</b> (${savedData.totalSets * TOTAL_QUESTIONS} ข้อ)<br>
                - ถูกสะสม: <b>${savedData.totalScore}</b> ข้อ | ผิดสะสม: <b>${savedData.totalWrong}</b> ข้อ<br>
                - เวลาเฉลี่ย: <b>${avgTimeToday} วินาที ต่อข้อ</b>
            `;
            document.getElementById('daily-stats').innerHTML = statsHtml;
        }

        window.onload = startExam;
    </script>
